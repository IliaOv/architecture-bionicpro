version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # Внешний источник учётных записей (представительство в другой стране).
  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: "BionicPRO"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    ports:
      - "389:389"

  # Распределённый кеш: серверное хранение сессий, access/refresh токенов.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HEALTH_ENABLED: "true"
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-changeme}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-changeme}
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap

  # BFF: обмен code+PKCE на токены, сессии, согласие/профиль (Задачи 2–3, 6).
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      REALM: reports-realm
      CLIENT_ID: reports-frontend
      CLIENT_SECRET: ""
      FRONTEND_URL: http://localhost:3000
      OIDC_REDIRECT_URI: http://localhost:3000/callback
      REPORTS_API_URL: http://reports-api:8080
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-bionicpro-dev-token-key-change-in-prod}
      PROFILE_DB_PATH: /data/profiles.db
    volumes:
      - ./bionicpro-auth-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - keycloak
      - redis

  # После старта Keycloak подставляет реальные секреты Яндекс ID (если заданы в .env).
  keycloak-yandex-init:
    image: curlimages/curl:8.8.0
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      REALM: reports-realm
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-changeme}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-changeme}
    volumes:
      - ./keycloak/yandex-idp-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_AUTH_URL: http://localhost:8000
        REACT_APP_KEYCLOAK_URL: http://localhost:8080
        REACT_APP_KEYCLOAK_REALM: reports-realm
        REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
        REACT_APP_OIDC_REDIRECT_URI: http://localhost:3000/callback
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

  # ==========================================================================
  # Сервис отчётов: источники (CRM) → CDC (Debezium/Kafka) → витрина (ClickHouse) → API
  # (Task 2 использовал batch-ETL на Airflow; Task 4 заменил его потоковым CDC.)
  # ==========================================================================

  # Источники данных: CRM (schema crm) и телеметрия (schema telemetry) в одном Postgres.
  # Task 4: wal_level=logical — обязательное условие для CDC через Debezium
  # (логическое декодирование WAL плагином pgoutput).
  sources-db:
    image: postgres:14
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: sources
      POSTGRES_USER: sources_user
      POSTGRES_PASSWORD: sources_password
    volumes:
      - ./sources-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres-sources-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sources_user -d sources"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # OLAP-хранилище: витрина отчётности.
  # Task 4: потребляет CDC-топики из Kafka через KafkaEngine и собирает витрину
  # MaterializedView'ами (init-скрипты в ./clickhouse/init).
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    depends_on:
      - kafka
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config/users.d/default-password.xml:/etc/clickhouse-server/users.d/default-password.xml:ro
      - ./clickhouse/config/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
      # Именованный volume (не bind-mount): на Windows иначе Permission denied у Kafka MV.
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"   # HTTP-интерфейс
      - "9000:9000"   # native

  # --------------------------------------------------------------------------
  # Task 4: batch-ETL на Airflow ЗАМЕНЁН потоковым CDC (Debezium → Kafka →
  # ClickHouse KafkaEngine → MaterializedView). Массовые выгрузки больше не
  # ходят в OLTP CRM: витрина наполняется из журнала WAL по мере изменений и
  # не влияет на транзакционные операции. Сервисы Airflow отключены (код DAG
  # сохранён в ./airflow/dags как артефакт Task 2). См. Task4/SOLUTION.md.
  # --------------------------------------------------------------------------

  # Координатор Kafka (Zookeeper).
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Брокер Kafka: транспорт CDC-событий из CRM в OLAP.
  # INTERNAL (kafka:9092) — для сервисов в docker-сети (Connect, ClickHouse);
  # EXTERNAL (localhost:29092) — для отладки с хоста.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"

  # Kafka Connect с runtime Debezium: захватывает изменения CRM и пишет в топики.
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      kafka:
        condition: service_started
      sources-db:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionic-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - "8083:8083"

  # Одноразовый регистратор Debezium-коннектора через REST Kafka Connect.
  # Ждёт Connect REST и здоровый Postgres; при 400 (БД ещё не принимает) — повторяет.
  debezium-connector-init:
    image: curlimages/curl:8.8.0
    depends_on:
      kafka-connect:
        condition: service_started
      sources-db:
        condition: service_healthy
    volumes:
      - ./debezium:/debezium:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "Ожидание Kafka Connect..."
        until curl -sf http://kafka-connect:8083/connectors >/dev/null; do sleep 3; done
        echo "Регистрация Debezium-коннектора CRM..."
        i=0
        while [ "$$i" -lt 30 ]; do
          i=$$((i + 1))
          body=$$(mktemp)
          code=$$(curl -s -o "$$body" -w "%{http_code}" -X POST \
            -H 'Content-Type: application/json' \
            --data @/debezium/crm-connector.json \
            http://kafka-connect:8083/connectors || true)
          echo "Попытка $$i: HTTP $$code"
          if [ "$$code" = "201" ] || [ "$$code" = "409" ]; then
            cat "$$body"
            echo
            echo "Коннектор зарегистрирован ($$code)."
            exit 0
          fi
          cat "$$body"
          echo
          sleep 5
        done
        echo "Не удалось зарегистрировать коннектор за 30 попыток"
        exit 1

  # ==========================================================================
  # Task 3. Кеш готовых отчётов: объектное хранилище (MinIO/S3) + CDN (nginx)
  # ==========================================================================

  # Объектное хранилище S3 API: кеш сформированных отчётов.
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio-data:/data
    ports:
      - "9002:9000"   # S3 API (host 9000 занят native-портом ClickHouse)
      - "9001:9001"   # веб-консоль MinIO

  # Эмуляция CDN: reverse proxy перед MinIO с кешированием статических отчётов.
  cdn:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - minio

  # Ресурс-сервис отчётов: bearer-only, self-only, читает готовую витрину из ClickHouse.
  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      REALM: reports-realm
      REPORT_ROLES: prothetic_user,user,administrator
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: reports
      # S3 (MinIO) — кеш готовых отчётов
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: reports
      # CDN (nginx перед MinIO) — публичная раздача отчётов
      CDN_PUBLIC_URL: http://localhost:8082
      REPORT_URL_SECRET: change-me-report-url-secret
    ports:
      - "8090:8080"   # 8080 на хосте занят Keycloak; внутри сети остаётся :8080
    depends_on:
      - keycloak
      - clickhouse
      - minio

volumes:
  clickhouse-data:
