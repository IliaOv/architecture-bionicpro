services:
  sources-db:
    image: postgres:14
    environment:
      POSTGRES_DB: sources
      POSTGRES_USER: sources_user
      POSTGRES_PASSWORD: sources_password
    volumes:
      - ../sources-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse-init:/docker-entrypoint-initdb.d
      - ./clickhouse-config/users.d/default-password.xml:/etc/clickhouse-server/users.d/default-password.xml:ro
    ports:
      - "8123:8123"
      - "9000:9000"

  airflow-db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: bionicpro-airflow:2.9.3
    depends_on:
      - airflow-db
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      SOURCES_PG_HOSTPORT: sources-db:5432
      SOURCES_PG_DB: sources
      SOURCES_PG_USER: sources_user
      SOURCES_PG_PASSWORD: sources_password
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
    volumes:
      - ./dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true

  airflow-webserver:
    image: bionicpro-airflow:2.9.3
    depends_on:
      - airflow-init
      - sources-db
      - clickhouse
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
    command: webserver
    ports:
      - "8081:8080"

  airflow-scheduler:
    image: bionicpro-airflow:2.9.3
    depends_on:
      - airflow-init
      - sources-db
      - clickhouse
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
    command: scheduler
