proxy_cache_path /var/cache/nginx/cdn
    levels=1:2
    keys_zone=cdn_cache:10m
    max_size=1g
    inactive=7d
    use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # Docker embedded DNS — резолв minio при запросе, а не только при старте nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin 'http://localhost:3000' always;
    add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
    add_header X-Cache-Status $upstream_cache_status always;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin 'http://localhost:3000' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        set $minio_upstream minio:9000;
        proxy_pass http://$minio_upstream;
        # Host = имя MinIO (path-style S3), не Host клиента CDN.
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;

        proxy_cache cdn_cache;
        proxy_cache_key "$request_method$request_uri";

        proxy_cache_valid 200 206 7d;
        proxy_cache_valid 404 10s;

        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;

        # Обход кеша: X-Purge: 1 (bypass, не purge зоны).
        proxy_cache_bypass $http_x_purge;
        proxy_no_cache $http_x_purge;
    }
}
